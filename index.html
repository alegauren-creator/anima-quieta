<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anima Quieta · di Alessio</title>
<meta name="description" content="Meditazione, musiche rilassanti e consigli saggi. Gratis, senza pubblicità, senza raccolta dati.">
<meta name="theme-color" content="#cfe3d4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="sp-glow"></div>
  <svg class="sp-lotus" viewBox="0 0 120 80"><g fill="none" stroke-width="2.4" stroke-linecap="round">
    <path class="pt" d="M60 70 C40 50 45 25 60 8 C75 25 80 50 60 70Z" stroke="#c9a7d8"/>
    <path class="pt" d="M60 70 C35 62 22 42 24 26 C42 32 56 48 60 70Z" stroke="#f2b8a2"/>
    <path class="pt" d="M60 70 C85 62 98 42 96 26 C78 32 64 48 60 70Z" stroke="#f2b8a2"/>
    <path class="pt" d="M60 72 C38 74 14 66 6 52 C26 50 46 58 60 72Z" stroke="#9cc5a8"/>
    <path class="pt" d="M60 72 C82 74 106 66 114 52 C94 50 74 58 60 72Z" stroke="#9cc5a8"/></g></svg>
  <h1 class="sp-title">Anima Quieta</h1>
  <p class="sp-sub" id="spSub">respira · ascolta · fiorisci</p>
</div>

<div id="scene" aria-hidden="true"></div>
<canvas id="particles" aria-hidden="true"></canvas>
<div id="sweep" aria-hidden="true"></div>

<header class="top">
  <button class="brand" data-go="home" aria-label="Home"><img src="icons/icon.svg" alt="" width="34" height="34"><span>Anima Quieta</span></button>
  <div class="tools">
    <div class="langsel" role="group" data-i18n-aria="lang_aria"><button data-lang="it" lang="it">IT</button><button data-lang="en" lang="en">EN</button><button data-lang="fr" lang="fr">FR</button></div>
    <button id="musicBtn" class="round" aria-pressed="false" data-i18n-aria="music_aria"><span class="ico" aria-hidden="true">♪</span><span class="lbl" data-i18n="music"></span></button>
  </div>
</header>

<main id="views">
<section class="view" id="v-home" data-scene="alba">
  <div class="hero">
    <p class="hello" id="hello"></p>
    <h2 data-i18n="home_h"></h2>
    <p class="lead" data-i18n="home_lead"></p>
  </div>
  <div class="duo">
    <div class="card c-sage stag streak" id="streak"></div>
    <div class="tarot stag" id="tarot"></div>
  </div>
  <div class="daily card c-peach stag" aria-live="polite"><h3 data-i18n="daily_h"></h3><p id="dailyTip"></p><div class="row" id="dailyRow"></div></div>
  <nav class="grid">
    <button class="tile c-sage stag" data-go="medita"><span class="em" aria-hidden="true">🧘</span><b data-i18n="t_med"></b><small data-i18n="t_med_s"></small></button>
    <button class="tile c-sky stag" data-go="respiro"><span class="em" aria-hidden="true">🌬️</span><b data-i18n="t_br"></b><small data-i18n="t_br_s"></small></button>
    <button class="tile c-lav stag" data-go="musica"><span class="em" aria-hidden="true">🎶</span><b data-i18n="t_mus"></b><small data-i18n="t_mus_s"></small></button>
    <button class="tile c-rose stag" data-go="consiglio"><span class="em" aria-hidden="true">💬</span><b data-i18n="t_ask"></b><small data-i18n="t_ask_s"></small></button>
    <button class="tile c-sky stag wide" data-go="diario"><span class="em" aria-hidden="true">📔</span><b id="tDiary"></b><small id="tDiaryS"></small></button>
    <button class="tile c-peach stag wide" data-go="chisono"><span class="em" aria-hidden="true">🌸</span><b data-i18n="t_me"></b><small data-i18n="t_me_s"></small></button>
  </nav>
</section>

<section class="view" id="v-medita" data-scene="loto" hidden>
  <h2 class="ttl stag" data-i18n="med_ttl"></h2>
  <div class="tabs stag" role="tablist" id="medTabs">
    <button role="tab" aria-selected="true" class="on" data-tab="m-cos"></button><button role="tab" aria-selected="false" data-tab="m-basi"></button><button role="tab" aria-selected="false" data-tab="m-pos"></button><button role="tab" aria-selected="false" data-tab="m-guide"></button><button role="tab" aria-selected="false" data-tab="m-err"></button>
  </div>
  <div class="tab on" id="m-cos" role="tabpanel"><div class="card c-sage stag" data-i18n="m_cos1"></div><div class="card c-sky stag" data-i18n="m_cos2"></div></div>
  <div class="tab" id="m-basi" role="tabpanel"><div class="card c-lav stag" data-i18n="m_basi"></div></div>
  <div class="tab" id="m-pos" role="tabpanel"><div id="postures"></div></div>
  <div class="tab" id="m-guide" role="tabpanel"><p class="lead stag" data-i18n="guides_lead"></p><div id="guides"></div></div>
  <div class="tab" id="m-err" role="tabpanel"><div class="card c-rose stag" data-i18n="m_err1"></div><div class="card c-sage stag" data-i18n="m_err2"></div></div>
</section>

<section class="view" id="v-respiro" data-scene="cielo" hidden>
  <h2 class="ttl stag" data-i18n="br_ttl"></h2>
  <div class="tabs stag" id="breathTabs"><button class="on" data-br="478"></button><button data-br="box"></button><button data-br="dia"></button></div>
  <p class="lead stag" id="brDesc"></p>
  <div class="breath stag"><div class="ring r1"></div><div class="ring r2"></div>
    <div id="bcircle" aria-live="polite"><span id="bphase"></span><small id="bcount"></small></div></div>
  <div class="row stag"><button class="btn primary" id="bStart"></button><span id="bCycles" class="muted"></span></div>
  <p class="note stag" data-i18n="br_note"></p>
</section>

<section class="view" id="v-musica" data-scene="mare" hidden>
  <h2 class="ttl stag" data-i18n="mus_ttl"></h2>
  <p class="lead stag" data-i18n="mus_lead"></p>
  <div id="ambList" class="amb"></div>
  <div class="card c-sky stag">
    <h3 data-i18n="timer_h"></h3>
    <div class="chips" id="timerChips"><button data-min="0" class="on" data-i18n="timer_none"></button><button data-min="10">10 min</button><button data-min="20">20 min</button><button data-min="30">30 min</button><button data-min="60">60 min</button></div>
    <p class="muted" id="timerLeft" aria-live="polite"></p>
    <label class="vol"><span data-i18n="vol"></span> <input type="range" id="vol" min="0" max="100" value="70"></label>
  </div>
</section>

<section class="view" id="v-consiglio" data-scene="bosco" hidden>
  <h2 class="ttl stag" data-i18n="ask_ttl"></h2>
  <p class="lead stag" data-i18n="ask_lead"></p>
  <form id="askForm" class="ask stag"><label for="q" class="sr" data-i18n="ask_label"></label>
    <textarea id="q" rows="3" data-i18n-ph="ask_ph"></textarea>
    <button class="btn primary" type="submit" data-i18n="ask_btn"></button></form>
  <div class="chips stag" id="suggest"></div>
  <div id="answer" class="card c-rose answer" hidden aria-live="polite"><p class="topic" id="aTopic"></p><p id="aText"></p>
    <div class="row"><button class="btn" id="another" data-i18n="another"></button><button class="btn ghost" id="copyA" data-i18n="copy"></button></div></div>
  <div class="row stag"><button class="btn ghost" id="randomTip" data-i18n="surprise"></button></div>
</section>

<section class="view" id="v-diario" data-scene="prato" hidden>
  <h2 class="ttl stag" id="jTtl"></h2>
  <p class="lead stag" id="jLead"></p>
  <form class="card c-peach stag jform" id="jForm"><h3 id="jToday"></h3>
    <label><span>1</span><input id="j1" maxlength="200" autocomplete="off"></label>
    <label><span>2</span><input id="j2" maxlength="200" autocomplete="off"></label>
    <label><span>3</span><input id="j3" maxlength="200" autocomplete="off"></label>
    <div class="row"><button class="btn primary" type="submit" id="jSave"></button><span class="muted" id="jMsg" aria-live="polite"></span></div></form>
  <p class="note stag" id="jPriv"></p>
  <h3 class="stag" id="jPast"></h3>
  <div id="jList"></div>
</section>

<section class="view" id="v-chisono" data-scene="prato" hidden>
  <h2 class="ttl stag" data-i18n="me_ttl"></h2>
  <div class="card c-peach stag bio"><div class="avatar" aria-hidden="true">A</div><div data-i18n="bio"></div></div>
  <a class="btn tiktok stag" href="https://www.tiktok.com/@a_g.auren" target="_blank" rel="noopener" data-i18n="tiktok"></a>
  <div class="card c-lav stag"><h3 data-i18n="contacts_h"></h3><p data-i18n="contacts_p"></p>
    <a class="btn" href="mailto:aleg.auren@gmail.com">✉️ aleg.auren@gmail.com</a>
    <a class="btn wa" href="https://wa.me/qr/L4SHBNHXK6KGN1" target="_blank" rel="noopener" data-i18n="wa"></a></div>
  <div class="card c-sage stag" data-i18n="privacy"></div>
  <p class="muted center" data-i18n="footer"></p>
</section>
</main>

<nav class="bottom" data-i18n-aria="nav_aria">
  <button data-go="home" class="on"><span aria-hidden="true">🏡</span><em></em></button>
  <button data-go="medita"><span aria-hidden="true">🧘</span><em></em></button>
  <button data-go="respiro"><span aria-hidden="true">🌬️</span><em></em></button>
  <button data-go="musica"><span aria-hidden="true">🎶</span><em></em></button>
  <button data-go="consiglio"><span aria-hidden="true">💬</span><em></em></button>
  <button data-go="chisono"><span aria-hidden="true">🌸</span><em></em></button>
</nav>
<script src="i18n.js"></script>
<script src="advice.js"></script>
<script src="advice_en.js"></script>
<script src="advice_fr.js"></script>
<script src="intentions.js"></script>
<script src="audio.js"></script>
<script src="app.js"></script>
<script src="features.js"></script>
</body>
</html>
